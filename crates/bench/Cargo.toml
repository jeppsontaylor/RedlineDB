[package]
name = "redlinedb-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-utils = "0.8"
hdrhistogram = "7"
libc = "0.2"
rand = "0.9"
rand_chacha = "0.9"
redlinedb = { path = "../redlinedb" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
