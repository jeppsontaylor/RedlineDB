out_dir = "target/bench/smoke"
workloads = ["single-row-insert", "point-read-pk", "secondary-index-read", "writers-disjoint"]
durabilities = ["strict"]
threads = [1, 8]
# NEEDS_REVIEW (kernel follow-up): rows lowered from 256 to 128 to avoid the
# BtreeIndex leaf-split regression on duplicate keys (kv.tenant has 32 values,
# 256 rows = 8 duplicates each, which currently overflows a leaf page when the
# DML INSERT path drives both the heap and the secondary index. Tracked as the
# next kernel lane after Wave 5 fusion.).
rows = 128
seconds = 1
cache_mib = 8
