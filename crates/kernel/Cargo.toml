[package]
name = "redlinedb-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
arc-swap = "1.7"
crc32fast = "1.5"
fail = { version = "0.5", features = ["failpoints"], optional = true }
parking_lot = "0.12"
serde_json = "1.0"
smallvec = "1.13"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.23"

[features]
default = []
failpoints = ["dep:fail"]
